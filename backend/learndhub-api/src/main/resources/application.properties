# ===== Servidor =====
server.port=8080

# ===== Perfil activo =====
# En Docker se fuerza SPRING_PROFILES_ACTIVE=prod (ver docker-compose.yml).
# Si no se define ninguno, usa H2 embebida (desarrollo local sin Docker).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== Carga de archivos =====
learndhub.storage.directorio=${LEARNDHUB_STORAGE_DIR:./storage}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
