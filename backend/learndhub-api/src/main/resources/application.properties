# ===== Servidor =====
server.port=8080

# ===== Base de datos H2 embebida (archivo local, persiste entre ejecuciones) =====
spring.datasource.url=jdbc:h2:file:./data/learndhub;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 disponible en /h2-console (solo para depuración local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Carga de archivos =====
learndhub.storage.directorio=./storage
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
