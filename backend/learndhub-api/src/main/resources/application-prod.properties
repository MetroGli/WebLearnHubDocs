# Perfil de producción (Docker): PostgreSQL, configurado por variables de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:learndhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:learndhub}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Consola H2 desactivada en producción (no aplica, usamos Postgres)
spring.h2.console.enabled=false
